name: frontend

on:
  pull_request:
  push:
    branches: [main, "phase/**", "claude/**"]

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - name: Format, analyze, metrics
        run: ./pao lint dart
      - name: Unit and widget tests
        run: ./pao test dart
      - name: Coverage (100% per package)
        run: ./pao cover dart
      - name: Build admin web
        working-directory: frontend/apps/admin
        run: flutter build web --release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: { name: dart-coverage, path: "frontend/**/coverage/lcov.info" }

  android:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        app: [customer, partner]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - name: Build debug APK
        working-directory: frontend/apps/${{ matrix.app }}
        run: flutter build apk --debug
