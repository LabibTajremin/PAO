name: backend

on:
  pull_request:
  push:
    branches: [main, "phase/**", "claude/**"]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_USER: pao, POSTGRES_PASSWORD: pao, POSTGRES_DB: pao }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pao -d pao" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
      storage:
        image: rustfs/rustfs:1.0.1
        env: { RUSTFS_ACCESS_KEY: pao-ci, RUSTFS_SECRET_KEY: pao-ci-secret }
        ports: ["9000:9000"]
        options: >-
          --health-cmd "curl -fsS http://localhost:9000/health" --health-interval 5s --health-retries 20
    env:
      PAO_TEST_DATABASE_URL: postgres://pao:pao@localhost:5432/pao?sslmode=disable
      PAO_TEST_REDIS_URL: redis://localhost:6379/15
      PAO_TEST_S3_ENDPOINT: http://localhost:9000
      PAO_TEST_S3_ACCESS_KEY: pao-ci
      PAO_TEST_S3_SECRET_KEY: pao-ci-secret
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install tools
        run: |
          sudo apt-get install -y -q shellcheck bats
          go install github.com/fe3dback/go-arch-lint@v1.19.0
          go install github.com/vladopajic/go-test-coverage/v2@v2.11.4
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          go install github.com/zricethezav/gitleaks/v8@v8.21.2
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.27.0
          go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.4.1
          go install go.uber.org/mock/mockgen@v0.5.0
      - uses: golangci/golangci-lint-action@25e2cdc5eb1d7a04fdc45ff538f1a00e960ae128 # v8.0.0
        with:
          version: v2.14.0
          working-directory: backend
      - name: Lint (shell, file sizes, architecture)
        run: ./pao lint shell && ./pao lint go
      - name: CLI tests
        run: bats test/cli
      - name: Unit + integration tests
        run: ./pao test integration
      - name: Coverage (100%)
        run: ./pao cover go
      - name: Security
        run: |
          gitleaks git --no-banner --redact .
          (cd backend && govulncheck ./...)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: { name: go-coverage, path: coverage/ }
