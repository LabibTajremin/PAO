name: backend

# Branches are checked through their pull request; a push trigger on them too would
# run every job twice and starve the small macOS runner pool.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_USER: pao, POSTGRES_PASSWORD: pao, POSTGRES_DB: pao }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pao -d pao" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
      storage:
        image: rustfs/rustfs:1.0.1
        env: { RUSTFS_ACCESS_KEY: pao-ci, RUSTFS_SECRET_KEY: pao-ci-secret, RUSTFS_SSE_S3_MASTER_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=" }
        ports: ["9000:9000"]
        options: >-
          --health-cmd "curl -fsS http://localhost:9000/health" --health-interval 5s --health-retries 20
    env:
      PAO_TEST_DATABASE_URL: postgres://pao:pao@localhost:5432/pao?sslmode=disable
      PAO_TEST_REDIS_URL: redis://localhost:6379/15
      PAO_TEST_S3_ENDPOINT: http://localhost:9000
      PAO_TEST_S3_ACCESS_KEY: pao-ci
      PAO_TEST_S3_SECRET_KEY: pao-ci-secret
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: Backend/global.json
      - name: .NET gates (build, format, spec, architecture, size, docs, tests, 100% coverage, start-up smoke)
        run: Backend/scripts/ci.sh all
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: { name: backend-coverage, path: out/coverage/ }

  # The repository's own tooling: the pao CLI and hooks, alert rules and dashboards,
  # and the security scans of the tree and the backend image.
  tooling:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0 }
      - name: Install tools
        run: |
          sudo apt-get install -y -q shellcheck bats
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz |
            sudo tar -xz -C /usr/local/bin gitleaks
          curl -fsSL https://github.com/prometheus/prometheus/releases/download/v3.5.0/prometheus-3.5.0.linux-amd64.tar.gz |
            sudo tar -xz -C /usr/local/bin --strip-components=1 prometheus-3.5.0.linux-amd64/promtool
          sudo curl -fsSL -o /usr/local/bin/osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.2.3/osv-scanner_linux_amd64
          sudo chmod +x /usr/local/bin/osv-scanner
          docker pull -q mirror.gcr.io/aquasec/trivy:0.64.1
      - name: Shell lint
        run: ./pao lint shell
      - name: Alert rules and dashboards
        run: ./pao ops check
      - name: CLI tests
        run: bats tools/cli
      - name: Backend image for the scan
        run: docker build -q -t pao-backend:ci -f Backend/docker/Dockerfile Backend
      - name: Security (gitleaks, osv-scanner, trivy source + image)
        env:
          PAO_SCAN_IMAGE: pao-backend:ci
        run: ./pao security
