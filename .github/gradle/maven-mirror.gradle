// CI only (.github/workflows/frontend.yml). Maven Central has answered downloads with
// redirects to GitHub Releases that returned 504, and with 429 when the six Android jobs
// start together; Google's mirror of Maven Central serves the same files directly.
// Repositories that name Central are pointed at the mirror. The Gradle Plugin Portal
// redirects to Central too, so build scripts (Flutter's plugin loader among them) get the
// mirror first and only fall through to the portal for plugin markers. Applies to
// included builds too, and leaves google() and Flutter's own repository alone.
def mirror = 'https://maven-central.storage-download.googleapis.com/maven2/'
def mirrorName = 'GoogleMavenCentralMirror'
def centralHosts = ['repo.maven.apache.org', 'repo1.maven.org']
def useMirror = { RepositoryHandler repos ->
    repos.withType(MavenArtifactRepository).configureEach { repo ->
        if (repo.url.host in centralHosts) {
            repo.url = mirror
        }
    }
}
def mirrorFirst = { RepositoryHandler repos ->
    useMirror(repos)
    if (repos.findByName(mirrorName) == null) {
        def first = repos.maven { name = mirrorName; url = mirror }
        repos.remove(first)
        repos.addFirst(first)
    }
}
beforeSettings { settings ->
    def plugins = settings.pluginManagement.repositories
    mirrorFirst(plugins)
    mirrorFirst(settings.buildscript.repositories)
    useMirror(settings.dependencyResolutionManagement.repositories)
    // A build that names no plugin repository gets the portal implicitly; the mirror above
    // would replace that default, so the portal is added back behind it.
    settings.gradle.settingsEvaluated {
        if (plugins.size() == 1) {
            plugins.gradlePluginPortal()
        }
    }
}
allprojects { project ->
    mirrorFirst(project.buildscript.repositories)
    useMirror(project.repositories)
}
