# Two-way reviews (C-11, P-09).
ReviewTag:
  type: string
  description: Fixed tag list; apps translate the keys.
  enum: [on_time, professional, quality_work, clean, friendly, fair_price, late, rude, poor_quality, messy, polite, clear_instructions, paid_promptly, safe_place, unclear_instructions, unsafe_place]
  example: on_time
ReviewInput:
  type: object
  required: [stars]
  properties:
    stars: { type: integer, minimum: 1, maximum: 5, example: 5 }
    tags: { type: array, maxItems: 6, uniqueItems: true, items: { $ref: "#/ReviewTag" } }
    comment: { type: string, maxLength: 500, example: Fixed the fan quickly and cleaned up. }
Review:
  type: object
  required: [id, bookingId, stars, tags, createdAt, authorName]
  properties:
    id: { type: string, format: uuid }
    bookingId: { type: string, format: uuid }
    stars: { type: integer, example: 5 }
    tags: { type: array, items: { $ref: "#/ReviewTag" } }
    comment: { type: string }
    authorName: { type: string, description: First name only., example: Nusrat }
    serviceName: { $ref: "./common.yaml#/LocalizedText" }
    createdAt: { type: string, format: date-time }
ReviewList:
  type: object
  required: [items]
  properties:
    items: { type: array, items: { $ref: "#/Review" } }
    nextCursor: { $ref: "./common.yaml#/PageCursor" }
