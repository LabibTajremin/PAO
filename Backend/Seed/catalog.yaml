  - { email: verifier@pao.bd, name: Verifier, roles: [verifier] }
  - { email: catalog@pao.bd, name: Catalog Manager, roles: [catalog_manager] }
  - { email: support@pao.bd, name: Support Agent, roles: [support_agent] }
