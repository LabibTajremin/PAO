# MVP catalog (D2, ADR-0035 §5): seven services with BN/EN names and fixed prices in BDT.
# Loaded idempotently by `migrate seed` (`./pao seed`); `key` values derive stable IDs, so editing a price
# here and reseeding inserts a new price version instead of changing history.
# Prices are placeholders for the owner to confirm before launch.
categories:
  - key: electrical
    name: { en: Electrical, bn: বৈদ্যুতিক }
    icon: plug
    services:
      - key: electrician
        name: { en: Electrician, bn: ইলেকট্রিশিয়ান }
        icon: bolt
        model: on_demand
        required_level: 1
        search_radius_m: 5000
        level2_checklist:
          - { en: Safe wiring, bn: নিরাপদ ওয়্যারিং }
          - { en: Correct tool use, bn: সঠিক যন্ত্রপাতির ব্যবহার }
          - { en: Earthing awareness, bn: আর্থিং সম্পর্কে জ্ঞান }
        sub_services:
          - { key: fan-install, name: { en: Ceiling fan installation, bn: সিলিং ফ্যান স্থাপন }, unit: unit, price: 500, max_quantity: 10 }
          - { key: light-switch-repair, name: { en: Light or switch repair, bn: লাইট বা সুইচ মেরামত }, unit: unit, price: 300, max_quantity: 20 }
          - { key: socket-install, name: { en: Socket installation, bn: সকেট স্থাপন }, unit: unit, price: 350, max_quantity: 20 }
          - { key: breaker-replace, name: { en: Circuit breaker replacement, bn: সার্কিট ব্রেকার পরিবর্তন }, unit: unit, price: 900, max_quantity: 5 }
          - { key: wiring-inspection, name: { en: Wiring inspection, bn: ওয়্যারিং পরিদর্শন }, unit: job, price: 800, max_quantity: 1 }
  - key: plumbing
    name: { en: Plumbing, bn: প্লাম্বিং }
    icon: droplet
    services:
      - key: plumber
        name: { en: Plumber, bn: প্লাম্বার }
        icon: wrench
        model: on_demand
        required_level: 1
        search_radius_m: 5000
        level2_checklist:
          - { en: Leak diagnosis, bn: লিক শনাক্তকরণ }
          - { en: Pipe fitting, bn: পাইপ ফিটিং }
        sub_services:
          - { key: tap-repair, name: { en: Tap repair, bn: কল মেরামত }, unit: unit, price: 400, max_quantity: 10 }
          - { key: leak-repair, name: { en: Pipe leak repair, bn: পাইপ লিক মেরামত }, unit: job, price: 700, max_quantity: 1 }
          - { key: basin-install, name: { en: Basin installation, bn: বেসিন স্থাপন }, unit: unit, price: 1200, max_quantity: 5 }
          - { key: commode-install, name: { en: Commode installation, bn: কমোড স্থাপন }, unit: unit, price: 2500, max_quantity: 3 }
          - { key: drain-unclog, name: { en: Drain unclogging, bn: ড্রেন পরিষ্কার }, unit: job, price: 800, max_quantity: 1 }
          - { key: tank-cleaning, name: { en: Water tank cleaning, bn: পানির ট্যাংক পরিষ্কার }, unit: job, price: 2000, max_quantity: 1 }
  - key: appliances
    name: { en: Appliances, bn: যন্ত্রপাতি }
    icon: snowflake
    services:
      - key: ac-service
        name: { en: AC service, bn: এসি সার্ভিস }
        icon: snowflake
        model: on_demand
        required_level: 1
        search_radius_m: 7000
        level2_checklist:
          - { en: Gas handling safety, bn: গ্যাস ব্যবহারে নিরাপত্তা }
          - { en: Electrical isolation, bn: বৈদ্যুতিক বিচ্ছিন্নকরণ }
        sub_services:
          - { key: ac-cleaning, name: { en: AC general service, bn: এসি সাধারণ সার্ভিস }, unit: unit, price: 1200, max_quantity: 6 }
          - { key: ac-gas-refill, name: { en: AC gas refill, bn: এসি গ্যাস রিফিল }, unit: unit, price: 3500, max_quantity: 6 }
          - { key: ac-repair-check, name: { en: AC repair check-up, bn: এসি মেরামত পরীক্ষা }, unit: unit, price: 800, max_quantity: 6 }
          - { key: ac-install, name: { en: AC installation, bn: এসি স্থাপন }, unit: unit, price: 3000, max_quantity: 6 }
          - { key: ac-uninstall, name: { en: AC uninstallation, bn: এসি খোলা }, unit: unit, price: 1500, max_quantity: 6 }
  - key: beauty
    name: { en: Beauty, bn: বিউটি }
    icon: sparkles
    services:
      - key: home-salon
        name: { en: Home salon, bn: হোম স্যালন }
        icon: scissors
        model: on_demand
        required_level: 1
        search_radius_m: 6000
        women_providers_only: true
        level2_checklist:
          - { en: Hygiene, bn: পরিচ্ছন্নতা }
          - { en: Product knowledge, bn: পণ্য সম্পর্কে জ্ঞান }
        sub_services:
          - { key: haircut, name: { en: Haircut, bn: চুল কাটা }, unit: job, price: 600, max_quantity: 1 }
          - { key: facial, name: { en: Facial, bn: ফেসিয়াল }, unit: job, price: 1500, max_quantity: 1 }
          - { key: manicure, name: { en: Manicure, bn: ম্যানিকিউর }, unit: job, price: 700, max_quantity: 1 }
          - { key: pedicure, name: { en: Pedicure, bn: পেডিকিউর }, unit: job, price: 800, max_quantity: 1 }
          - { key: mehedi, name: { en: Mehedi (henna), bn: মেহেদি }, unit: job, price: 1000, max_quantity: 1 }
          - { key: threading, name: { en: Eyebrow threading, bn: ভ্রু থ্রেডিং }, unit: unit, price: 200, max_quantity: 3 }
  - key: transport
    name: { en: Transport, bn: পরিবহন }
    icon: car
    services:
      - key: driver
        name: { en: Driver, bn: ড্রাইভার }
        icon: steering-wheel
        model: duration_hire
        required_level: 1
        search_radius_m: 10000
        level2_checklist:
          - { en: Valid driving licence, bn: বৈধ ড্রাইভিং লাইসেন্স }
          - { en: Road test, bn: রোড টেস্ট }
        sub_services:
          - { key: driver-day, name: { en: Driver for 1 day (8 hours), bn: ১ দিনের জন্য ড্রাইভার (৮ ঘণ্টা) }, unit: day, price: 1500, max_quantity: 1 }
  # ADR-0035 §5: two categories added on the owner's request; prices are fixed per unit.
  - key: catering
    name: { en: Catering, bn: ক্যাটারিং }
    icon: utensils
    services:
      - key: home-catering
        name: { en: Home catering, bn: হোম ক্যাটারিং }
        icon: chef-hat
        model: on_demand
        required_level: 1
        search_radius_m: 10000
        level2_checklist:
          - { en: Food hygiene, bn: খাদ্য পরিচ্ছন্নতা }
          - { en: Safe food handling, bn: নিরাপদ খাবার ব্যবস্থাপনা }
        sub_services:
          - { key: catering-plain-meal, name: { en: Plain meal (per person), bn: সাধারণ খাবার (জনপ্রতি) }, unit: unit, price: 250, max_quantity: 200 }
          - { key: catering-biryani, name: { en: Kacchi biryani (per person), bn: কাচ্চি বিরিয়ানি (জনপ্রতি) }, unit: unit, price: 450, max_quantity: 200 }
          - { key: catering-snacks, name: { en: Snacks box (per person), bn: নাস্তার বক্স (জনপ্রতি) }, unit: unit, price: 150, max_quantity: 200 }
          - { key: catering-cook-day, name: { en: Cook for a day, bn: এক দিনের জন্য রাঁধুনি }, unit: day, price: 2000, max_quantity: 3 }
  - key: monthly-bazar
    name: { en: Monthly Bazar, bn: মাসিক বাজার }
    icon: shopping-basket
    services:
      - key: bazar-delivery
        name: { en: Monthly bazar delivery, bn: মাসিক বাজার ডেলিভারি }
        icon: shopping-bag
        model: on_demand
        required_level: 1
        search_radius_m: 8000
        level2_checklist:
          - { en: Fair pricing, bn: ন্যায্য মূল্য }
          - { en: Fresh goods, bn: তাজা পণ্য }
        sub_services:
          - { key: bazar-small, name: { en: Small family pack (2–3 people), bn: ছোট পরিবার প্যাক (২–৩ জন) }, unit: job, price: 6000, max_quantity: 1 }
          - { key: bazar-medium, name: { en: Medium family pack (4–5 people), bn: মাঝারি পরিবার প্যাক (৪–৫ জন) }, unit: job, price: 9500, max_quantity: 1 }
          - { key: bazar-large, name: { en: Large family pack (6+ people), bn: বড় পরিবার প্যাক (৬+ জন) }, unit: job, price: 14000, max_quantity: 1 }
          - { key: bazar-shopping-service, name: { en: Shopping and delivery service, bn: কেনাকাটা ও ডেলিভারি সেবা }, unit: job, price: 300, max_quantity: 1 }

