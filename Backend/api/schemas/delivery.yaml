# Scheduled delivery: service schedules, subscriptions and their dates (ADR-0041, P25).
DeliveryPattern:
  type: string
  description: How the dates repeat; `weekdays` and `weekly` use `weekdays`, `monthly` uses `dayOfMonth`.
  enum: [once, daily, weekdays, weekly, monthly]
QuantityUnit:
  type: string
  enum: [meals, guests, package]
DeliveryWindow:
  type: object
  description: A delivery window in Asia/Dhaka time.
  required: [start, end]
  properties:
    start: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", example: "12:00" }
    end: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", example: "13:00" }
ServiceSchedule:
  type: object
  description: The ordering rules of a scheduled-delivery service, set by the admin.
  required: [patterns, windows, leadHours, cutoff, unit, minQuantity, maxQuantity]
  properties:
    patterns: { type: array, minItems: 1, maxItems: 5, uniqueItems: true, items: { $ref: "#/DeliveryPattern" } }
    windows: { type: array, minItems: 1, maxItems: 8, items: { $ref: "#/DeliveryWindow" } }
    leadHours: { type: integer, minimum: 0, maximum: 336, example: 12 }
    cutoff: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", description: Orders and changes for a date close at this time on the day before., example: "20:00" }
    unit: { $ref: "#/QuantityUnit" }
    minQuantity: { type: integer, minimum: 1, maximum: 500, example: 1 }
    maxQuantity: { type: integer, minimum: 1, maximum: 500, example: 50 }
SubscriptionStatus:
  type: string
  enum: [requested, active, paused, finished, declined, cancelled]
DeliveryStatus:
  type: string
  description: "Derived: scheduled until the cutoff sweep makes a booking, then the booking's progress."
  enum: [scheduled, preparing, out_for_delivery, delivered, skipped, declined, cancelled]
SubscriptionCreate:
  type: object
  required: [providerId, serviceId, items, addressId, pattern, window, startDate]
  properties:
    providerId: { type: string, format: uuid }
    serviceId: { type: string, format: uuid }
    items: { type: array, minItems: 1, maxItems: 10, items: { $ref: "./booking.yaml#/BookingItemInput" } }
    addressId: { type: string, format: uuid }
    pattern: { $ref: "#/DeliveryPattern" }
    weekdays: { type: array, maxItems: 7, uniqueItems: true, description: "0 is Sunday and 5 is Friday.", items: { type: integer, minimum: 0, maximum: 6 } }
    dayOfMonth: { type: integer, minimum: 1, maximum: 31 }
    window: { $ref: "#/DeliveryWindow" }
    startDate: { type: string, format: date }
    endDate: { type: string, format: date, description: The last date; leave out with count for an open subscription. }
    count: { type: integer, minimum: 1, maximum: 366, description: "How many deliveries, instead of an end date." }
    note: { type: string, maxLength: 500 }
DeliveryDate:
  type: object
  required: [date, status, items, total]
  properties:
    date: { type: string, format: date }
    status: { $ref: "#/DeliveryStatus" }
    items: { type: array, items: { $ref: "./booking.yaml#/BookingItemInput" } }
    total: { $ref: "./common.yaml#/Money" }
    bookingId: { type: string, format: uuid, description: The booking the delivery became. }
    changeable: { type: boolean, description: Whether the date's cutoff has not passed yet. }
Subscription:
  type: object
  required: [id, number, status, serviceId, serviceName, items, total, pattern, window, startDate, address, createdAt]
  properties:
    id: { type: string, format: uuid }
    number: { type: string, example: PAO-S-104233 }
    status: { $ref: "#/SubscriptionStatus" }
    serviceId: { type: string, format: uuid }
    serviceName: { $ref: "./common.yaml#/LocalizedText" }
    provider: { $ref: "./booking.yaml#/BookingParty" }
    customer: { $ref: "./booking.yaml#/BookingParty" }
    items: { type: array, items: { $ref: "./booking.yaml#/BookingItem" } }
    total: { $ref: "./common.yaml#/Money" }
    unit: { $ref: "#/QuantityUnit" }
    pattern: { $ref: "#/DeliveryPattern" }
    weekdays: { type: array, items: { type: integer } }
    dayOfMonth: { type: integer }
    window: { $ref: "#/DeliveryWindow" }
    startDate: { type: string, format: date }
    endDate: { type: string, format: date }
    count: { type: integer }
    address: { $ref: "./booking.yaml#/BookingAddress" }
    note: { type: string }
    createdAt: { type: string, format: date-time }
    upcoming: { type: array, description: "The next dates, up to 31 days ahead.", items: { $ref: "#/DeliveryDate" } }
SubscriptionList:
  type: object
  required: [items]
  properties:
    items: { type: array, items: { $ref: "#/Subscription" } }
DeliveryChange:
  type: object
  description: "Skip a date (skip: true), bring it back (skip: false) or change its items, before its cutoff."
  properties:
    skip: { type: boolean }
    items: { type: array, minItems: 1, maxItems: 10, items: { $ref: "./booking.yaml#/BookingItemInput" } }
ProviderDelivery:
  type: object
  required: [subscriptionId, number, date, window, status, serviceName, items, total, address]
  properties:
    subscriptionId: { type: string, format: uuid }
    number: { type: string }
    date: { type: string, format: date }
    window: { $ref: "#/DeliveryWindow" }
    status: { $ref: "#/DeliveryStatus" }
    serviceName: { $ref: "./common.yaml#/LocalizedText" }
    items: { type: array, items: { $ref: "./booking.yaml#/BookingItemInput" } }
    total: { $ref: "./common.yaml#/Money" }
    address: { $ref: "./booking.yaml#/BookingAddress" }
    customerName: { type: string }
    bookingId: { type: string, format: uuid }
ProviderDeliveryList:
  type: object
  required: [items]
  properties:
    items: { type: array, items: { $ref: "#/ProviderDelivery" } }
