name: pao_ui
description: "PAO design system: tokens, accent themes and shared widgets."
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.5.0
  pao_l10n:
    path: ../pao_l10n

dev_dependencies:
  dart_code_linter: ^4.4.2
  flutter_localizations:
    sdk: flutter
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/artwork/
    - assets/brand/
    - assets/icons/
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Variable.ttf
    - family: NotoSansBengali
      fonts:
        - asset: fonts/NotoSansBengali-Variable.ttf
