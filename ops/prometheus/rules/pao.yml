# Alert and recording rules for the PAO API and worker. The scrape config names the
# jobs pao-api and pao-worker (ops/prometheus/prometheus.yml); runbooks live in
# docs/runbooks/. Validate with ./pao ops check.
groups:
  - name: pao-api
    rules:
      - record: pao:http_requests:rate5m
        expr: sum by (route) (rate(pao_http_requests_total[5m]))

      - record: pao:http_server_errors:ratio_rate5m
        expr: |
          sum(rate(pao_http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(pao_http_requests_total[5m])), 1e-9)

      - alert: PaoApiDown
        expr: up{job="pao-api"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "API instance {{ $labels.instance }} is not answering scrapes"
          runbook: docs/runbooks/incident-checklist.md

      - alert: PaoApiHighErrorRate
        # 99.5% availability (PRD §11) leaves 0.5% of requests to fail; 2% for five
        # minutes burns a month's budget in under two days.
        expr: pao:http_server_errors:ratio_rate5m > 0.02
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "{{ $value | humanizePercentage }} of API requests fail with 5xx"
          runbook: docs/runbooks/incident-checklist.md

      - alert: PaoApiElevatedErrorRate
        expr: pao:http_server_errors:ratio_rate5m > 0.005
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "API 5xx rate {{ $value | humanizePercentage }} is above the 0.5% budget"
          runbook: docs/runbooks/incident-checklist.md

      - alert: PaoNearbySearchSlow
        # PRD §11: nearby-provider search under 300 ms at p95.
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(
            pao_http_request_duration_seconds_bucket{route="/v1/customer/providers/nearby"}[10m]
          ))) > 0.3
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Nearby search p95 is {{ $value | humanizeDuration }} (target 300 ms)"
          runbook: docs/runbooks/incident-checklist.md

  - name: pao-worker
    rules:
      - alert: PaoWorkerDown
        expr: up{job="pao-worker"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Worker {{ $labels.instance }} is down: no events, pushes or jobs run"
          runbook: docs/runbooks/incident-checklist.md

      - alert: PaoJobFailing
        expr: sum by (name) (increase(pao_job_runs_total{outcome="failed"}[1h])) > 0
        labels: { severity: warning }
        annotations:
          summary: "Scheduled job {{ $labels.name }} failed in the last hour"
          description: The worker logs carry the error ("job failed", field job).
          runbook: docs/runbooks/incident-checklist.md

      - alert: PaoOutboxLagging
        # Booking requests must reach the provider in under 3 s (PRD §11); a minute of
        # backlog means notifications and read models are stale.
        expr: max by (module) (pao_outbox_oldest_pending_seconds) > 60
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.module }} outbox has events waiting {{ $value | humanizeDuration }}"
          runbook: docs/runbooks/incident-checklist.md

      - alert: PaoOutboxDeadLetters
        expr: sum by (module, event) (increase(pao_outbox_delivery_failures_total{dead="true"}[15m])) > 0
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.event }} events from {{ $labels.module }} were dead-lettered"
          description: A subscriber failed ten times; the event will not be retried on its own.
          runbook: docs/runbooks/incident-checklist.md
