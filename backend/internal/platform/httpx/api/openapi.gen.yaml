    AdminUserUpdate:
      type: object
      properties:
        roles:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AdminRole'
        active:
          type: boolean
    RoleDefinition:
      type: object
      required:
        - role
        - permissions
        - screens
      properties:
        role:
          $ref: '#/components/schemas/Role'
        permissions:
          type: array
          items:
            type: string
        screens:
          type: array
          items:
            type: string
    RoleList:
      type: object
      required:
        - items
        - allPermissions
        - allScreens
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RoleDefinition'
        allPermissions:
          type: array
          items:
            type: string
        allScreens:
          type: array
          items:
            type: string
    RoleUpdate:
      type: object
      required:
        - permissions
