openapi: 3.1.0
info:
  title: PAO API
  version: 1.0.0
  license:
    name: Proprietary — all rights reserved
    url: https://getpao.com/legal
  description: |
    REST contract shared by the PAO Go backend and the Flutter apps.

    - Versioned under `/v1`, with route groups `/v1/customer`, `/v1/provider` and `/v1/admin` (PRD §9.6).
    - Every error uses `ErrorResponse`; `code` is a stable `ErrorCode` the apps translate.
    - `x-permission` on each operation names the permission the caller must hold
      (`public` = no token, `authenticated` = any signed-in account). `:own` permissions
      are also checked against the resource owner.
    - Lists use cursor pagination (`cursor`, `limit` ≤ 100, `nextCursor`).
    - Money is integer paisa. Times are UTC (RFC 3339); apps display Asia/Dhaka.
servers:
  - url: http://localhost:8080
    description: Local Docker stack
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Sign-in by OTP, token refresh, logout and admin 2FA.
  - name: Me
    description: The signed-in account, its permissions and deletion.
  - name: Customer
    description: Customer profile, addresses, catalog and provider discovery.
  - name: Customer bookings
    description: Booking lifecycle from the customer side.
  - name: Provider
    description: Provider profile, catalog and reviews.
  - name: Provider enrolment
    description: The enrolment wizard and verification status.
  - name: Provider jobs
    description: Presence, requests, job actions and earnings.
  - name: Admin
    description: Dashboard.
  - name: Admin catalog
    description: Catalog and price management.
  - name: Admin verification
    description: Verification queue, document review and Level 2 sessions.
  - name: Admin people
    description: Provider and customer management.
  - name: Admin bookings
    description: Bookings monitor.
  - name: Admin complaints
    description: Complaints queue.
  - name: Admin settings
    description: Settings, audit log, admin users and roles.
paths:
  /v1/auth/otp/request:
    post:
      operationId: requestOtp
      tags:
        - Auth
      summary: Send a 6-digit sign-in code by SMS
      x-permission: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpRequestAccepted'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/otp/verify:
    post:
      operationId: verifyOtp
      tags:
        - Auth
      summary: Verify the code and sign in (creates the account on first use)
      x-permission: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/refresh:
    post:
      operationId: refreshToken
      tags:
        - Auth
      summary: Rotate the refresh token and issue a new access token
      x-permission: public
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          headers:
            Set-Cookie:
              description: 'Admin web only: the rotated refresh token as an HttpOnly, Secure, SameSite=Strict cookie.'
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      parameters:
        - name: pao_refresh
          in: cookie
          required: false
          description: Admin web refresh token (HttpOnly cookie).
          schema:
            type: string
  /v1/auth/logout:
    post:
      operationId: logout
      tags:
        - Auth
      summary: Sign out this device, or every device
      x-permission: authenticated
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: No content
          headers:
            Set-Cookie:
              description: Clears the admin refresh cookie.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      parameters:
        - name: pao_refresh
          in: cookie
          required: false
          description: Admin web refresh token (HttpOnly cookie).
          schema:
            type: string
  /v1/auth/admin/login:
    post:
      operationId: adminLogin
      tags:
        - Auth
      summary: 'Admin step 1: email and password; returns a TOTP challenge'
      x-permission: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLoginChallenge'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/admin/totp:
    post:
      operationId: adminVerifyTotp
      tags:
        - Auth
      summary: 'Admin step 2: TOTP code; sets the refresh cookie'
      x-permission: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminTotpRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          headers:
            Set-Cookie:
              description: 'Admin web only: the rotated refresh token as an HttpOnly, Secure, SameSite=Strict cookie.'
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/admin/password:
    post:
      operationId: changeAdminPassword
      tags:
        - Auth
      summary: 'Admin: replace the temporary or current password'
      x-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminPasswordChange'
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /v1/me:
    get:
      operationId: getMe
      tags:
        - Me
      summary: The signed-in account
      x-permission: authenticated
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      operationId: deleteMe
      tags:
        - Me
      summary: Delete the account after re-confirming with an OTP (PRD §11)
      x-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /v1/me/permissions:
    get:
      operationId: getMyPermissions
      tags:
        - Me
      summary: Roles, permissions and screen IDs for route guards
      x-permission: authenticated
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyPermissions'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/customer/profile:
    get:
      operationId: getCustomerProfile
      tags:
        - Customer
      summary: The customer profile
      x-permission: profile:manage:own
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProfile'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateCustomerProfile
      tags:
        - Customer
      summary: Create or update the customer profile
      x-permission: profile:manage:own
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerProfileUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProfile'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /v1/customer/addresses:
    get:
      operationId: listAddresses
      tags:
        - Customer
      summary: Saved addresses
      x-permission: address:manage:own
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createAddress
      tags:
        - Customer
      summary: Save an address (max 10)
      x-permission: address:manage:own
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /v1/customer/addresses/{addressId}:
    put:
      operationId: updateAddress
      tags:
        - Customer
      summary: Edit a saved address
      x-permission: address:manage:own
      parameters:
        - $ref: '#/components/parameters/AddressId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      operationId: deleteAddress
      tags:
        - Customer
      summary: Delete a saved address
      x-permission: address:manage:own
      parameters:
        - $ref: '#/components/parameters/AddressId'
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /v1/customer/addresses/{addressId}/default:
    post:
      operationId: setDefaultAddress
      tags:
        - Customer
      summary: Make an address the default
      x-permission: address:manage:own
      parameters:
        - $ref: '#/components/parameters/AddressId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /v1/customer/service-area:
    get:
      operationId: checkServiceArea
      tags:
        - Customer
      summary: Is this point inside an active launch area? (C35)
      x-permission: catalog:read
      parameters:
        - $ref: '#/components/parameters/Lat'
        - $ref: '#/components/parameters/Lng'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAreaCheck'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /v1/customer/catalog:
    get:
      operationId: getCatalog
      tags:
        - Customer
      summary: Published categories, services and sub-services with prices
      x-permission: catalog:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogTree'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/customer/catalog/search:
    get:
      operationId: searchCatalog
      tags:
        - Customer
      summary: Search services and sub-services in Bangla or English
      x-permission: catalog:read
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogSearchResults'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /v1/customer/services/{serviceId}:
    get:
      operationId: getService
      tags:
        - Customer
      summary: Service detail with sub-services and fixed prices
      x-permission: catalog:read
      parameters:
        - $ref: '#/components/parameters/ServiceId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /v1/customer/providers/nearby:
    get:
      operationId: findNearbyProviders
      tags:
        - Customer
      summary: Verified, online providers near an address for a sub-service (C10)
      x-permission: provider:browse
      parameters:
        - $ref: '#/components/parameters/ServiceIdQuery'
        - $ref: '#/components/parameters/SubServiceIdQuery'
        - name: quantity
          in: query
          description: Quantity of the sub-service.
          required: true
          schema:
            type: integer
        - name: addressId
          in: query
          description: Saved address to search around.
          required: false
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/LatOptional'
        - $ref: '#/components/parameters/LngOptional'
        - name: sort
          in: query
          description: Sort order.
          required: false
          schema:
            type: string
            enum:
              - distance
              - rating
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NearbyProviders'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /v1/customer/providers/{providerId}:
    get:
      operationId: getProviderPublicProfile
      tags:
        - Customer
      summary: Public provider profile (C11)
      x-permission: provider:browse
      parameters:
        - $ref: '#/components/parameters/ProviderId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderPublicProfile'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /v1/customer/providers/{providerId}/reviews:
    get:
      operationId: listProviderReviews
      tags:
        - Customer
      summary: Reviews of a provider (C42)
      x-permission: provider:browse
      parameters:
        - $ref: '#/components/parameters/ProviderId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /v1/customer/bookings:
    post:
      operationId: createBooking
      tags:
        - Customer bookings
      summary: Request a booking with one provider (idempotent)
      x-permission: booking:create
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    get:
      operationId: listCustomerBookings
      tags:
        - Customer bookings
      summary: Upcoming or past bookings (C18)
      x-permission: booking:read:own
      parameters:
        - $ref: '#/components/parameters/BookingTab'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /v1/customer/bookings/{bookingId}:
    get:
      operationId: getCustomerBooking
      tags:
        - Customer bookings
      summary: Booking detail with timeline (C19)
      x-permission: booking:read:own
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /v1/customer/bookings/{bookingId}/start-code:
    get:
      operationId: getStartCode
      tags:
        - Customer bookings
      summary: The 4-digit start code, shown only to the customer
      x-permission: booking:read:own
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartCode'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /v1/customer/bookings/{bookingId}/cancel:
    post:
      operationId: cancelCustomerBooking
      tags:
        - Customer bookings
      summary: Cancel until the start code is entered (C-10)
      x-permission: booking:cancel:own
      parameters:
        - $ref: '#/components/parameters/BookingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCancelInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /v1/customer/bookings/{bookingId}/extras/decision:
    post:
      operationId: decideExtras
      tags:
        - Customer bookings
      summary: Approve or decline proposed extra items (C15)
      x-permission: booking:update:own
      parameters:
        - $ref: '#/components/parameters/BookingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtrasDecisionInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /v1/customer/bookings/{bookingId}/receipt:
    get:
      operationId: getCustomerReceipt
      tags:
        - Customer bookings
      summary: Receipt of a completed booking (C64)
      x-permission: booking:read:own
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /v1/customer/bookings/{bookingId}/review:
    post:
      operationId: reviewProvider
      tags:
        - Customer bookings
      summary: Rate the provider after completion (C-11)
      x-permission: review:create
      parameters:
        - $ref: '#/components/parameters/BookingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
