    ComplaintReason:
      type: string
      enum:
        - no_show
        - late
        - poor_quality
        - overcharge
        - damage
        - behaviour
        - safety
        - customer_unavailable
        - payment
        - other
      example: poor_quality
    ComplaintInput:
      type: object
      required:
        - reason
        - description
      properties:
        reason:
          $ref: '#/components/schemas/ComplaintReason'
        description:
          type: string
          minLength: 10
          maxLength: 1000
          example: The fan still wobbles after installation.
        photoMediaIds:
          type: array
          maxItems: 5
          items:
            type: string
            format: uuid
    ComplaintStatus:
      type: string
      enum:
        - open
        - assigned
        - resolved
      example: open
    ComplaintComment:
      type: object
      required:
        - authorId
        - body
        - at
      properties:
        authorId:
          type: string
          format: uuid
        body:
          type: string
        at:
          type: string
          format: date-time
    Complaint:
      type: object
      required:
        - id
        - ticketNumber
        - bookingId
        - reporterRole
        - reporterId
        - reason
        - description
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        ticketNumber:
          type: string
          example: TCK-002341
        bookingId:
          type: string
          format: uuid
        reporterRole:
          type: string
          enum:
            - customer
            - provider
        reporterId:
          type: string
          format: uuid
        againstId:
          type: string
          format: uuid
        reason:
          $ref: '#/components/schemas/ComplaintReason'
        description:
          type: string
        photoMediaIds:
          type: array
          items:
            type: string
            format: uuid
        status:
          $ref: '#/components/schemas/ComplaintStatus'
        assigneeId:
          type: string
          format: uuid
        resolution:
          type: string
        verified:
          type: boolean
          description: A verified complaint feeds the provider quality review (PRD §6.4).
        comments:
          type: array
          items:
            $ref: '#/components/schemas/ComplaintComment'
        createdAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
    ComplaintList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Complaint'
        nextCursor:
          $ref: '#/components/schemas/PageCursor'
    ComplaintAssignInput:
      type: object
      required:
        - assigneeId
      properties:
        assigneeId:
          type: string
          format: uuid
    ComplaintCommentInput:
      type: object
      required:
        - body
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 1000
    ComplaintResolveInput:
      type: object
      required:
        - resolution
        - verified
      properties:
        resolution:
          type: string
          minLength: 5
          maxLength: 1000
        verified:
          type: boolean
    Dashboard:
      type: object
      required:
        - providersByStatus
        - providersByLevel
        - bookingsPerDay
        - completionRate
        - openComplaints
        - pendingVerifications
        - generatedAt
      properties:
        providersByStatus:
          type: object
          additionalProperties:
            type: integer
          example:
            active: 120
            pending: 34
            suspended: 2
            banned: 1
        providersByLevel:
          type: object
          additionalProperties:
            type: integer
          example:
            '0': 34
            '1': 100
            '2': 20
        bookingsPerDay:
          type: array
          items:
            type: object
            required:
              - date
              - total
              - completed
            properties:
              date:
                type: string
                format: date
              total:
                type: integer
              completed:
                type: integer
        completionRate:
          type: number
          format: double
          example: 0.86
        openComplaints:
          type: integer
        pendingVerifications:
          type: integer
        generatedAt:
          type: string
          format: date-time
    AdminRole:
      type: string
      enum:
        - verifier
        - catalog_manager
        - support_agent
        - super_admin
      example: verifier
    AdminUser:
      type: object
      required:
        - id
        - email
        - name
        - roles
        - active
        - totpEnrolled
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/AdminRole'
        active:
          type: boolean
        totpEnrolled:
          type: boolean
        lastLoginAt:
          type: string
          format: date-time
    AdminUserList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
    AdminUserInvite:
      type: object
      required:
        - email
        - name
        - roles
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        name:
          type: string
          minLength: 2
          maxLength: 80
        roles:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AdminRole'
    AdminUserInvited:
      type: object
      required:
        - user
        - temporaryPassword
