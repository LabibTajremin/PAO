components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: EdDSA access token (15 minutes).
    refreshCookie:
      type: apiKey
      in: cookie
      name: pao_refresh
      description: Admin web refresh token (HttpOnly, Secure, SameSite=Strict).
  parameters:
    Cursor:
      name: cursor
      in: query
      description: Cursor from the previous page's `nextCursor`.
      schema:
        type: string
        maxLength: 200
    Limit:
      name: limit
      in: query
      description: Page size (default 20, max 100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated key; repeating a request with the same key returns the first result for 24 h (PRD §9.6).
      schema:
        type: string
        minLength: 8
        maxLength: 100
        example: 6f1c2a9e-booking-1
    AddressId:
      name: addressId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ServiceId:
      name: serviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SubServiceId:
      name: subServiceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProviderId:
      name: providerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BookingId:
      name: bookingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MediaId:
      name: mediaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ComplaintId:
      name: complaintId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AdminUserId:
      name: adminUserId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SettingKey:
      name: key
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-z0-9_.]{3,80}$
    RolePath:
      name: role
      in: path
      required: true
      schema:
        type: string
        enum:
          - customer
          - provider
          - verifier
          - catalog_manager
          - support_agent
          - super_admin
    ItemTypePath:
      name: itemType
      in: path
      required: true
      schema:
        type: string
        enum:
          - nid
          - selfie
          - police_clearance
          - address
          - emergency_contact
          - skill_proof
          - service_area
          - code_of_conduct
    ServiceIdQuery:
      name: serviceId
      in: query
      required: true
      schema:
        type: string
        format: uuid
    SubServiceIdQuery:
      name: subServiceId
      in: query
      required: true
      schema:
        type: string
        format: uuid
    SearchQuery:
      name: q
      in: query
      required: true
      description: Bangla or English text.
      schema:
        type: string
        minLength: 1
        maxLength: 80
    Lat:
      name: lat
      in: query
      required: true
      schema:
        type: number
        format: double
        minimum: -90
        maximum: 90
    Lng:
      name: lng
      in: query
      required: true
      schema:
        type: number
        format: double
        minimum: -180
        maximum: 180
    LatOptional:
      name: lat
      in: query
      description: Use with lng instead of addressId.
      schema:
        type: number
        format: double
        minimum: -90
        maximum: 90
    LngOptional:
      name: lng
      in: query
      description: Use with lat instead of addressId.
      schema:
        type: number
        format: double
        minimum: -180
        maximum: 180
    BookingTab:
      name: tab
      in: query
      required: true
      schema:
        type: string
        enum:
          - upcoming
          - past
    JobTab:
      name: tab
      in: query
      required: true
      schema:
        type: string
        enum:
          - requests
          - upcoming
          - past
    PeriodParam:
      name: period
      in: query
      required: true
      schema:
        type: string
        enum:
          - day
          - week
          - month
  responses:
    Unauthenticated:
      description: Missing, invalid or expired access token (UNAUTHENTICATED, TOKEN_EXPIRED) or a failed credential check.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: UNAUTHENTICATED
              message: Sign in again.
    Forbidden:
      description: The caller lacks the operation's x-permission, does not own the resource, or the account is banned or suspended.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: FORBIDDEN
              message: Permission booking:cancel:own required.
    NotFound:
      description: The resource does not exist or is not visible to the caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: NOT_FOUND
              message: Booking not found.
    Conflict:
      description: The request conflicts with the current state (e.g. BOOKING_INVALID_TRANSITION).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: BOOKING_INVALID_TRANSITION
              message: The booking is no longer requested.
    ValidationFailed:
      description: The request does not match the schema or a business validation rule.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: VALIDATION_FAILED
              message: Invalid request.
              details:
                field: phone
    TooManyRequests:
      description: Rate limit or attempt limit reached; retry after the given number of seconds.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: RATE_LIMITED
              message: Too many requests.
  schemas:
    ErrorResponse:
      type: object
      description: The single error format used by every endpoint (PRD §9.6).
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      example:
        error:
          code: NOT_FOUND
          message: Booking not found.
    ErrorBody:
      type: object
      required:
        - code
        - message
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: English description for logs; apps translate `code` instead.
        details:
          type: object
          description: Machine-readable context, e.g. the invalid fields.
          additionalProperties: true
    ErrorCode:
      type: string
      description: Stable error codes the apps translate (04-decisions.md E11).
      enum:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - TOKEN_EXPIRED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - RATE_LIMITED
        - INTERNAL
        - NOT_IMPLEMENTED
        - OTP_INVALID
        - OTP_EXPIRED
        - OTP_LOCKED
        - ACCOUNT_BANNED
        - ACCOUNT_SUSPENDED
        - INVALID_CREDENTIALS
        - ACCOUNT_LOCKED
        - TOTP_INVALID
        - MFA_CHALLENGE_EXPIRED
        - REFRESH_TOKEN_INVALID
        - IDEMPOTENCY_KEY_REQUIRED
        - IDEMPOTENCY_KEY_REUSED
        - ADDRESS_LIMIT_REACHED
        - OUTSIDE_SERVICE_AREA
        - SERVICE_UNAVAILABLE
        - PROVIDER_UNAVAILABLE
        - DUPLICATE_BOOKING_REQUEST
        - BOOKING_INVALID_TRANSITION
        - BOOKING_ALREADY_RESPONDED
        - ACTIVE_JOB_EXISTS
        - START_CODE_INVALID
        - START_CODE_LOCKED
        - CANCELLATION_NOT_ALLOWED
        - EXTRA_ITEM_INVALID
        - EXTRAS_PENDING
        - CASH_CONFIRMATION_REQUIRED
        - REVIEW_NOT_ALLOWED
        - REVIEW_ALREADY_SUBMITTED
        - UPLOAD_INVALID
        - UPLOAD_NOT_FOUND
        - ENROLMENT_INCOMPLETE
        - NOT_VERIFIED
        - AGE_REQUIREMENT
        - LEVEL2_COOLING_OFF
        - COMPLAINT_INVALID_TRANSITION
        - SETTING_INVALID
        - ROLE_INVALID
    Money:
      type: integer
      format: int64
      description: Amount in paisa (1 BDT = 100 paisa). Never a float (04-decisions.md E9).
      example: 113000
    PageCursor:
      type: string
      description: Opaque cursor for the next page (base64 of created_at and id).
      example: eyJ0IjoiMjAyNi0xMC0wOVQxMDowMDowMFoifQ
    Point:
      type: object
      description: WGS84 position.
      required:
        - lat
        - lng
      properties:
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: 23.7808
        lng:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: 90.4152
    LocalizedText:
      type: object
      description: A text in both product languages.
      required:
        - en
        - bn
      properties:
        en:
          type: string
          minLength: 1
          maxLength: 200
          example: Electrician
        bn:
          type: string
          minLength: 1
          maxLength: 200
          example: ইলেকট্রিশিয়ান
    Language:
      type: string
      enum:
        - en
        - bn
      example: bn
    Phone:
      type: string
      description: Bangladeshi mobile number; the API normalises to +8801XXXXXXXXX.
      pattern: ^(\+?880|0)?1[3-9][0-9]{8}$
      example: '+8801712345678'
    Level:
      type: integer
      description: Verification level (PRD §6.1) — 0 Registered, 1 Verified, 2 PAO Verified Pro.
      minimum: 0
      maximum: 2
      example: 1
    Gender:
      type: string
      enum:
        - female
        - male
        - other
      example: female
    Platform:
      type: string
      enum:
        - android
        - ios
        - web
      example: android
    DeviceTokenInput:
      type: object
      required:
        - token
        - platform
      properties:
        token:
          type: string
          minLength: 10
          maxLength: 4096
          example: fcm-token-abc123...
        platform:
          $ref: '#/components/schemas/Platform'
    StatusReason:
      type: object
      description: A free-text reason recorded with a decision.
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
          example: Document is blurred.
    OtpPurpose:
      type: string
      description: Why the code is sent. `delete_account` re-confirms account deletion.
      enum:
        - login
        - delete_account
      example: login
    OtpRequest:
      type: object
      required:
        - phone
      properties:
        phone:
          $ref: '#/components/schemas/Phone'
        purpose:
          $ref: '#/components/schemas/OtpPurpose'
      example:
        phone: '+8801712345678'
        purpose: login
    OtpRequestAccepted:
      type: object
      required:
        - expiresInSeconds
        - resendAfterSeconds
      properties:
        expiresInSeconds:
          type: integer
          example: 300
        resendAfterSeconds:
          type: integer
          example: 60
    AppKind:
      type: string
      description: The app signing in; signing in to the partner app adds the provider role (PRD §3).
      enum:
        - customer
        - partner
      example: customer
    OtpVerifyRequest:
      type: object
      required:
        - phone
        - code
        - app
      properties:
        phone:
          $ref: '#/components/schemas/Phone'
        code:
          type: string
          pattern: ^[0-9]{6}$
          example: '482913'
        app:
          $ref: '#/components/schemas/AppKind'
    TokenPair:
      type: object
      required:
        - accessToken
        - expiresInSeconds
        - account
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJFZERTQSIsImtpZCI6ImsxIn0...
        refreshToken:
          type: string
          description: Omitted for the admin web app, which receives it as an HttpOnly cookie.
          example: 3q2-7wRk5sQ0x9nVb...
        expiresInSeconds:
          type: integer
          example: 900
        isNewAccount:
          type: boolean
          example: false
        account:
          $ref: '#/components/schemas/Account'
    RefreshRequest:
      type: object
      description: Mobile apps send the token in the body; the admin web app sends none and relies on the cookie.
      properties:
        refreshToken:
          type: string
          example: 3q2-7wRk5sQ0x9nVb...
    LogoutRequest:
      type: object
      properties:
        allDevices:
          type: boolean
          default: false
          example: false
    AdminLoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          example: verifier@pao.bd
        password:
          type: string
          minLength: 8
          maxLength: 128
          example: correct-horse-battery
    AdminLoginChallenge:
      type: object
      required:
        - challengeId
        - expiresInSeconds
      properties:
        challengeId:
          type: string
          format: uuid
          example: 0192f4a6-1c2b-7c1d-9e3f-5a6b7c8d9e0f
        expiresInSeconds:
          type: integer
          example: 300
        totpEnrolment:
          $ref: '#/components/schemas/TotpEnrolment'
        mustChangePassword:
          type: boolean
          description: True while the admin still uses the temporary password from the invite.
    TotpEnrolment:
      type: object
      description: Present on the first login; the admin scans it before entering a code.
      required:
        - secret
        - otpauthUrl
      properties:
        secret:
          type: string
          example: JBSWY3DPEHPK3PXP
        otpauthUrl:
          type: string
          example: otpauth://totp/PAO:verifier@pao.bd?secret=JBSWY3DPEHPK3PXP&issuer=PAO
    AdminTotpRequest:
      type: object
      required:
        - challengeId
        - code
      properties:
        challengeId:
          type: string
          format: uuid
          example: 0192f4a6-1c2b-7c1d-9e3f-5a6b7c8d9e0f
        code:
          type: string
          pattern: ^[0-9]{6}$
          example: '123456'
    AdminPasswordChange:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 8
          maxLength: 128
        newPassword:
          type: string
          minLength: 12
          maxLength: 128
          example: a-much-longer-passphrase
    AccountStatus:
      type: string
      description: PRD §6.4 account lifecycle.
      enum:
        - pending
        - active
        - suspended
        - banned
      example: active
    Role:
      type: string
      enum:
        - customer
        - provider
        - verifier
        - catalog_manager
        - support_agent
        - super_admin
      example: customer
    Account:
      type: object
      required:
        - id
        - roles
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          example: 0192f4a6-1c2b-7c1d-9e3f-5a6b7c8d9e0f
        phone:
          type: string
          example: '+8801712345678'
        email:
          type: string
          format: email
          example: verifier@pao.bd
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/AccountStatus'
        createdAt:
          type: string
          format: date-time
    MyPermissions:
      type: object
      required:
        - roles
        - permissions
        - screens
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        permissions:
          type: array
          items:
            type: string
          example:
            - booking:create
            - booking:read:own
        screens:
          type: array
          items:
            type: string
          example:
            - C01
            - C07
            - C10
        providerGate:
          type: boolean
          description: True while a provider is below Level 1 and limited to screens M01–M14.
          example: false
    DeleteAccountRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          pattern: ^[0-9]{6}$
          example: '482913'
    CustomerProfile:
      type: object
      required:
        - id
        - name
        - language
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Nusrat Jahan
        phone:
          type: string
          example: '+8801712345678'
        photoUrl:
          type: string
