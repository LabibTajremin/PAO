# sqlc: one entry per module. Schemas are the goose migrations in migrations/<module>;
# queries live in the module's adapter/postgres/queries.sql. The official TypeScript
# plugin emits pg-driver functions into adapter/postgres/sqlc/, which is generated code
# (excluded from lint and coverage). Regenerate with `npm run gen`.
version: '2'
plugins:
  - name: ts
    wasm:
      url: https://downloads.sqlc.dev/plugin/sqlc-gen-typescript_0.1.3.wasm
      sha256: 287df8f6cc06377d67ad5ba02c9e0f00c585509881434d15ea8bd9fc751a9368
sql:
  - engine: postgresql
    schema: migrations/identity
    queries: src/modules/identity/adapter/postgres/queries.sql
    codegen:
      - plugin: ts
        out: src/modules/identity/adapter/postgres/sqlc
        options: { runtime: node, driver: pg }
  - engine: postgresql
    schema: migrations/customer
    queries: src/modules/customer/adapter/postgres/queries.sql
    codegen:
      - plugin: ts
        out: src/modules/customer/adapter/postgres/sqlc
        options: { runtime: node, driver: pg }
  - engine: postgresql
    schema: migrations/provider
    queries: src/modules/provider/adapter/postgres/queries.sql
    codegen:
      - plugin: ts
        out: src/modules/provider/adapter/postgres/sqlc
        options: { runtime: node, driver: pg }
  - engine: postgresql
    schema: migrations/verification
    queries: src/modules/verification/adapter/postgres/queries.sql
    codegen:
      - plugin: ts
        out: src/modules/verification/adapter/postgres/sqlc
        options: { runtime: node, driver: pg }
  - engine: postgresql
    schema: migrations/catalog
    queries: src/modules/catalog/adapter/postgres/queries.sql
    codegen:
