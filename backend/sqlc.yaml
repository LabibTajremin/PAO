    codegen:
      - plugin: ts
        out: src/modules/booking/adapter/postgres/sqlc
        options: { runtime: node, driver: pg }
  - engine: postgresql
    schema: migrations/rating
    queries: src/modules/rating/adapter/postgres/queries.sql
    codegen:
      - plugin: ts
        out: src/modules/rating/adapter/postgres/sqlc
        options: { runtime: node, driver: pg }
  - engine: postgresql
    schema: migrations/notification
    queries: src/modules/notification/adapter/postgres/queries.sql
    codegen:
      - plugin: ts
        out: src/modules/notification/adapter/postgres/sqlc
        options: { runtime: node, driver: pg }
  - engine: postgresql
    schema: migrations/media
    queries: src/modules/media/adapter/postgres/queries.sql
    codegen:
      - plugin: ts
        out: src/modules/media/adapter/postgres/sqlc
        options: { runtime: node, driver: pg }
  - engine: postgresql
    schema: migrations/admin
