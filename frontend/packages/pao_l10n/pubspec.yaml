name: pao_l10n
description: "Bangla and English strings for the PAO apps."
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

dev_dependencies:
  dart_code_linter: ^4.4.2
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true

coverage_exclude:
  - 'lib/l10n/generated/'
