name: pao_core
description: "Networking, session, permissions and routing shared by every PAO app."
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  connectivity_plus: ^7.3.2
  dio: ^5.11.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.0.1
  go_router: ^18.0.2
  image: ^4.10.1
  image_picker: ^1.2.4
  pao_l10n:
    path: ../pao_l10n
  pao_ui:
    path: ../pao_ui
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  dart_code_linter: ^4.4.2
  flutter_localizations:
    sdk: flutter
  flutter_test:
    sdk: flutter
  http_mock_adapter: ^0.6.1
  mocktail: ^1.0.5
  plugin_platform_interface: ^2.1.8
  url_launcher_platform_interface: ^2.3.2
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
