# End-to-end stack: a separate compose project on its own ports, so it can run beside
# the development stack and start from an empty database every time (admin 2FA
# enrolment happens on first sign-in, so a reused database would hold unknown secrets).
# stack.sh names the project and picks the ports, so several stacks can coexist.
services:
  postgres:
    ports: !reset []
  redis:
    ports: !reset []
  minio:
    ports: !override ["${PAO_E2E_S3_PORT:-9100}:9000"]
  api:
    ports: !override ["${PAO_E2E_API_PORT:-8180}:8080"]
  worker:
    ports: ["${PAO_E2E_WORKER_PORT:-9191}:9090"]
