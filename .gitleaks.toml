# gitleaks configuration: the default rules plus documented test-fixture false positives.
[extend]
useDefault = true

[allowlist]
description = ".env.example documents variable names with empty or local-only placeholder values; the TOTP tests use the key published in RFC 6238 appendix B; the .NET crypto tests use the dummy key base64(\"0123456789abcdef\" x2) and a JWT test vector signed with it by the NestJS backend"
paths = ['''^\.env\.example$''']
regexes = [
  '''GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ''',
  '''MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=''',
  '''eyJhbGciOiJFZERTQSIsImtpZCI6ImsxIiwidHlwIjoiSldUIn0\.eyJyb2xlcyI6WyJjdXN0b21lciJdLCJ2ZXIiOjMsInNpZCI6IjAxOTBhNWI''',
]
