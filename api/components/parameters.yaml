# Reusable parameters.
Cursor:
  name: cursor
  in: query
  description: Cursor from the previous page's `nextCursor`.
  schema: { type: string, maxLength: 200 }
Limit:
  name: limit
  in: query
  description: Page size (default 20, max 100).
  schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
IdempotencyKey:
  name: Idempotency-Key
  in: header
  required: true
  description: Client-generated key; repeating a request with the same key returns the first result for 24 h (PRD §9.6).
  schema: { type: string, minLength: 8, maxLength: 100, example: 6f1c2a9e-booking-1 }
AddressId: { name: addressId, in: path, required: true, schema: { type: string, format: uuid } }
ServiceId: { name: serviceId, in: path, required: true, schema: { type: string, format: uuid } }
CategoryId: { name: categoryId, in: path, required: true, schema: { type: string, format: uuid } }
SubServiceId: { name: subServiceId, in: path, required: true, schema: { type: string, format: uuid } }
ProviderId: { name: providerId, in: path, required: true, schema: { type: string, format: uuid } }
CustomerId: { name: customerId, in: path, required: true, schema: { type: string, format: uuid } }
BookingId: { name: bookingId, in: path, required: true, schema: { type: string, format: uuid } }
NotificationId: { name: notificationId, in: path, required: true, schema: { type: string, format: uuid } }
MediaId: { name: mediaId, in: path, required: true, schema: { type: string, format: uuid } }
SessionId: { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
ComplaintId: { name: complaintId, in: path, required: true, schema: { type: string, format: uuid } }
AdminUserId: { name: adminUserId, in: path, required: true, schema: { type: string, format: uuid } }
SettingKey: { name: key, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9_.]{3,80}$" } }
RolePath:
  name: role
  in: path
  required: true
  schema: { type: string, enum: [customer, provider, verifier, catalog_manager, support_agent, super_admin] }
ItemTypePath:
  name: itemType
  in: path
  required: true
  schema: { type: string, enum: [nid, selfie, police_clearance, address, emergency_contact, skill_proof, service_area, code_of_conduct] }
ServiceIdQuery: { name: serviceId, in: query, required: true, schema: { type: string, format: uuid } }
SubServiceIdQuery: { name: subServiceId, in: query, required: true, schema: { type: string, format: uuid } }
SearchQuery: { name: q, in: query, required: true, description: Bangla or English text., schema: { type: string, minLength: 1, maxLength: 80 } }
Lat: { name: lat, in: query, required: true, schema: { type: number, format: double, minimum: -90, maximum: 90 } }
Lng: { name: lng, in: query, required: true, schema: { type: number, format: double, minimum: -180, maximum: 180 } }
LatOptional: { name: lat, in: query, description: Use with lng instead of addressId., schema: { type: number, format: double, minimum: -90, maximum: 90 } }
LngOptional: { name: lng, in: query, description: Use with lat instead of addressId., schema: { type: number, format: double, minimum: -180, maximum: 180 } }
BookingTab:
  name: tab
  in: query
  required: true
  schema: { type: string, enum: [upcoming, past] }
JobTab:
  name: tab
  in: query
  required: true
  schema: { type: string, enum: [requests, upcoming, past] }
PeriodParam:
  name: period
  in: query
  required: true
  schema: { type: string, enum: [day, week, month] }
