# Generated from the operation table during P01; edit by hand from now on.
enrolment:
  get:
    operationId: getEnrolment
    tags:
    - Provider enrolment
    summary: Completion per wizard step (resumable)
    x-permission: provider:manage:own
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../schemas/provider.yaml#/EnrolmentStatus
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
stepPersonal:
  put:
    operationId: savePersonalStep
    tags:
    - Provider enrolment
    summary: 'M05: name as on NID, date of birth, gender, addresses'
    x-permission: provider:manage:own
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/provider.yaml#/PersonalInfoInput
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../schemas/provider.yaml#/EnrolmentStatus
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '409':
        $ref: ../components/responses.yaml#/Conflict
      '422':
        $ref: ../components/responses.yaml#/ValidationFailed
