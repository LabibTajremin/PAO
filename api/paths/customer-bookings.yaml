# Generated from the operation table during P01; edit by hand from now on.
bookings:
  post:
    operationId: createBooking
    tags:
    - Customer bookings
    summary: Request a booking with one provider (idempotent)
    x-permission: booking:create
    parameters:
    - $ref: ../components/parameters.yaml#/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/booking.yaml#/BookingCreate
    responses:
      '201':
        description: Created
        content:
          application/json:
            schema:
              $ref: ../schemas/booking.yaml#/Booking
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/Conflict
      '422':
        $ref: ../components/responses.yaml#/ValidationFailed
  get:
    operationId: listCustomerBookings
    tags:
    - Customer bookings
    summary: Upcoming or past bookings (C18)
    x-permission: booking:read:own
    parameters:
    - $ref: ../components/parameters.yaml#/BookingTab
    - $ref: ../components/parameters.yaml#/Cursor
    - $ref: ../components/parameters.yaml#/Limit
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../schemas/booking.yaml#/BookingList
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '422':
        $ref: ../components/responses.yaml#/ValidationFailed
