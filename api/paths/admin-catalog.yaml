# Generated from the operation table during P01; edit by hand from now on.
catalog:
  get:
    operationId: getAdminCatalog
    tags:
    - Admin catalog
    summary: Full catalog including unpublished items (A03)
    x-permission: catalog:manage
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../schemas/catalog.yaml#/CatalogTree
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
categoriesCreate:
  post:
    operationId: createCategory
    tags:
    - Admin catalog
    summary: Create a category
    x-permission: catalog:manage
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/catalog.yaml#/CategoryInput
    responses:
      '201':
        description: Created
        content:
          application/json:
            schema:
              $ref: ../schemas/catalog.yaml#/Category
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '422':
        $ref: ../components/responses.yaml#/ValidationFailed
categoriesUpdate:
  put:
    operationId: updateCategory
    tags:
    - Admin catalog
    summary: Update a category (publish/unpublish with `published`)
