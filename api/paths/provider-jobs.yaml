    summary: Complete the job and confirm cash received
    x-permission: job:progress
    parameters:
    - $ref: ../components/parameters.yaml#/BookingId
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/booking.yaml#/CompleteInput
    responses:
      '200':
        description: OK
