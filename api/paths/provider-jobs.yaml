jobReview:
  post:
    operationId: reviewCustomer
    tags:
    - Provider jobs
    summary: Rate the customer after completion (P-09)
    x-permission: review:create
    parameters:
    - $ref: ../components/parameters.yaml#/BookingId
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/rating.yaml#/ReviewInput
    responses:
      '201':
        description: Created
        content:
          application/json:
            schema:
              $ref: ../schemas/rating.yaml#/Review
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/Conflict
      '422':
        $ref: ../components/responses.yaml#/ValidationFailed
