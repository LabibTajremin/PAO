    summary: Cancel after acceptance with a reason (counts for quality)
    x-permission: job:respond
    parameters:
    - $ref: ../components/parameters.yaml#/BookingId
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/booking.yaml#/ProviderCancelInput
    responses:
      '200':
        description: OK
