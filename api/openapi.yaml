# PAO REST contract. Paths and schemas live in ./paths and ./schemas; `./pao gen` bundles
# them for the generators. See docs/build/phases/P01-contracts.md.
openapi: 3.1.0
info:
  title: PAO API
  version: 1.0.0
  license:
    name: Proprietary — all rights reserved
    url: https://getpao.com/legal
  description: |
    REST contract shared by the PAO Go backend and the Flutter apps.

    - Versioned under `/v1`, with route groups `/v1/customer`, `/v1/provider` and `/v1/admin` (PRD §9.6).
    - Every error uses `ErrorResponse`; `code` is a stable `ErrorCode` the apps translate.
    - `x-permission` on each operation names the permission the caller must hold
      (`public` = no token, `authenticated` = any signed-in account). `:own` permissions
      are also checked against the resource owner.
    - Lists use cursor pagination (`cursor`, `limit` ≤ 100, `nextCursor`).
    - Money is integer paisa. Times are UTC (RFC 3339); apps display Asia/Dhaka.
servers:
- url: http://localhost:8080
  description: Local Docker stack
tags:
- name: Auth
  description: Sign-in by OTP, token refresh, logout and admin 2FA.
- name: Me
  description: The signed-in account, its permissions and deletion.
- name: Customer
  description: Customer profile, addresses, catalog and provider discovery.
- name: Customer bookings
  description: Booking lifecycle from the customer side.
- name: Provider
  description: Provider profile, catalog and reviews.
- name: Provider enrolment
  description: The enrolment wizard and verification status.
- name: Provider jobs
  description: Presence, requests, job actions and earnings.
- name: Admin
  description: Dashboard.
- name: Admin catalog
  description: Catalog and price management.
- name: Admin verification
  description: Verification queue, document review and Level 2 sessions.
- name: Admin people
  description: Provider and customer management.
- name: Admin bookings
  description: Bookings monitor.
- name: Admin complaints
  description: Complaints queue.
- name: Admin settings
  description: Settings, audit log, admin users and roles.
security:
- bearerAuth: []
